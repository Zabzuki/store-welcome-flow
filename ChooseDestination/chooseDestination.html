<!DOCTYPE html>
<html lang="en">
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-BmbxuPwQa2lc/FVzBcNJ7UAyJxM6wuqIj61tLrc4wSX0szH/Ev+nYRRuWlolflfl"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/open-iconic/1.1.1/font/css/open-iconic-bootstrap.min.css"
      integrity="sha256-BJ/G+e+y7bQdrYkS2RBTyNfBHpA9IuGaPmf9htub5MQ="
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="chooseDestination.css" />
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test</title>
  </head>
  <body>
    <div class="container parent">
      <div class="row">
        <div
          class="col-sm-6 col-xs-6 col-lg-6 background d-sm-block d-none"
        ></div>
        <div class="col-sm-6 col-xs-6 col-lg-6 background2 col-12">
          <div class="container">
            <div class="row">
              <div class="col-sm-6 col-xs-6 col-lg-6 img mt-5 pt-5 mb-4">
                <h4 class="text-center">StoreFlow</h4>
              </div>
            </div>
            <div class="row">
              <div class="col-6 col-lg-6 m-auto" style="width: 15rem">
                <h5 class="text-center">Choose Destination</h5>
              </div>
            </div>
            <div class="row">
              <div
                class="progress p-0 m-auto"
                style="height: 8px; width: 15rem"
              >
                <div
                  class="progress-bar"
                  role="progressbar"
                  style="width: 100%; background-color: rgb(116, 194, 186)"
                  aria-valuenow="100"
                  aria-valuemin="0"
                  aria-valuemax="100"
                ></div>
              </div>
            </div>
            <div class="row">
              <div class="col-6 col-lg-6 col-12 mt-4 m-auto">
                <h6 class="text-center text-secondary">
                  Please select the destination that you'd like to connect your
                  store with
                </h6>
              </div>
              <div class="w-100 d-none d-md-block"></div>
              <div class="col-sm-6 col-xs-6 col-12">
                <div
                  class="card mx-auto d-block mt-5 shadow-sm"
                  style="width: fit-content"
                >
                  <div class="card-body">
                    <p
                      class="text-center"
                      style="font-size: 1.2em; margin-bottom: 0px"
                    >
                      Analytics A
                    </p>
                  </div>
                </div>
              </div>
              <div class="col-sm-6 col-12 mb-3">
                <div
                  class="card mx-auto d-block mt-5 shadow-sm"
                  style="width: fit-content"
                >
                  <div class="card-body">
                    <p
                      class="text-center"
                      style="font-size: 1.2em; margin-bottom: 0px"
                    >
                      Analytics B
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
