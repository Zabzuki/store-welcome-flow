<!DOCTYPE html>
<html lang="en">
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-BmbxuPwQa2lc/FVzBcNJ7UAyJxM6wuqIj61tLrc4wSX0szH/Ev+nYRRuWlolflfl"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/open-iconic/1.1.1/font/css/open-iconic-bootstrap.min.css"
      integrity="sha256-BJ/G+e+y7bQdrYkS2RBTyNfBHpA9IuGaPmf9htub5MQ="
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="store.css" />
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test</title>
  </head>
  <body>
    <div class="container parent">
      <div class="row">
        <div
          class="col-sm-6 col-xs-6 col-lg-6 d-sm-block d-none background"
        ></div>
        <div class="col-sm-6 col-xs-6 col-lg-6 col-12 background2">
          <div class="container">
            <div class="row">
              <div class="col-lg-6 col-12 img mt-5 pt-5 mb-4">
                <h4 class="text-center">StoreFlow</h4>
              </div>
            </div>
            <div class="row">
              <div class="col-6 col-lg-6 m-auto col-12" style="width: 15rem">
                <h5 class="text-center">Welcome to StoreFlow</h5>
              </div>
            </div>
            <div class="row">
              <div
                class="progress p-0 m-auto"
                style="height: 8px; width: 15rem"
              >
                <div
                  class="progress-bar"
                  role="progressbar"
                  style="width: 50%; background-color: rgb(116, 194, 186)"
                  aria-valuenow="50"
                  aria-valuemin="0"
                  aria-valuemax="100"
                ></div>
              </div>
            </div>
            <div class="row">
              <div class="w-100 d-none d-md-block"></div>
              <div class="col-6 col-lg-6 col-12 m-auto">
                <form id="form">
                  <div class="form-group mt-4">
                    <label for="inputName">Store name</label>
                    <input
                      name="storeName"
                      required
                      type="text"
                      class="form-control mt-1"
                      placeholder="Your Store Name"
                    />
                  </div>
                  <div class="form-group mt-3">
                    <label for="inputUrl">Store URL</label>
                    <input
                      name="url"
                      required
                      type="text"
                      class="form-control mt-1"
                      placeholder="yourstore.example-shop.com"
                    />
                  </div>
                  <div
                    class="card mt-4 mb-4 p-3"
                    style="background-color: rgb(221, 238, 237)"
                  >
                    <div class="form-group mt-1">
                      <label for="inputUrl">Email Notifications</label>
                      <input
                        name="email"
                        required
                        type="text"
                        class="form-control mt-1"
                        placeholder="jane@yourstore.com"
                      />
                    </div>
                    <div class="form-check">
                      <input
                        name="sendNotifications"
                        class="form-check-input"
                        type="checkbox"
                      />
                      <small
                        class="form-check-label small"
                        for="invalidCheck"
                        style="font-size: 0.7em"
                      >
                        Send me all the important app notifications on this
                        email
                      </small>
                    </div>
                    <div class="w-100 d-none d-md-block"></div>
                  </div>
                  <div class="col-6 col-lg-6 p-2 button text-end">
                    <button type="submit" class="btn btn-secondary btn-sm">
                      Next
                      <span class="oi oi-arrow-right"></span>
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="text/javascript" src="store.js"></script>
  </body>
</html>
